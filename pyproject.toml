[project]
name = "otb"
version = "0.1.0"
description = "Options trading bot: factor-based, vol-targeted, defined-risk. Backtest and live share one code path."
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.44",
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=15",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "pyyaml>=6",
  "hmmlearn>=0.3",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
otb = "otb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108", "E741", "B905", "B904", "SIM102", "SIM105"]
