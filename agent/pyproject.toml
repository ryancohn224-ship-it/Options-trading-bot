[project]
name = "trading-agent"
version = "0.1.0"
description = "Scheduled agent that runs a credit-gated 0DTE iron condor on Alpaca and journals every session"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
broker = ["alpaca-py>=0.42"]
dev = ["pytest>=8.0"]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
